name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bun audit
      - run: bun run build
      - run: bun run test:http
